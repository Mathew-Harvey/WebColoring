name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build
      - name: Built site is committed and up to date
        run: |
          # GitHub Pages serves the main branch as committed, so the build must be checked in.
          git add -A index.html assets sw.js manifest.webmanifest
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            echo "::error::The built site is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi
      - name: Content rules
        run: |
          ! grep -rniIw "minecraft\|lego\|cube world" src scripts public/books/index.json public/books/*/book.json README.md CREDITS.md
          ! grep -rnI "$(printf '\xe2\x80\x94')" src scripts README.md CREDITS.md
